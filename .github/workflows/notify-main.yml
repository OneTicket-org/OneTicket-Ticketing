# Asks OneTicket-main to move its submodule pointer for this service after a
# merge to `main` (protect `main` so that it only receives merged PRs).
# Identical in every service repository.
name: Notify OneTicket-main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SUBMODULE_BOT_APP_ID }}
          private-key: ${{ secrets.SUBMODULE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: OneTicket-main

      - name: Send service-updated event
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/${{ github.repository_owner }}/OneTicket-main/dispatches" \
            -f event_type=service-updated \
            -f "client_payload[service]=${{ github.event.repository.name }}" \
            -f "client_payload[sha]=${{ github.sha }}"
